name: TypeScript edition CI

on:
  push:
    branches: [edition/typescript]
  pull_request:
    branches: [edition/typescript]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockwild-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  BLOCKWILD_EDITION: typescript
  BLOCKWILD_NODE_VERSION: 22.13.1

jobs:
  edition-contract:
    name: TypeScript edition contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22.13.1
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BLOCKWILD_NODE_VERSION }}
      - name: Verify edition routing and maintenance contract
        run: npm run test:edition-maintenance

  quality:
    name: Static analysis and generated content
    needs: edition-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22.13.1
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BLOCKWILD_NODE_VERSION }}
      - name: Restore TypeScript npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: blockwild-typescript-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            blockwild-typescript-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify repository contract
        run: npm run test:repository
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npm run lint
      - name: Rebuild generated knowledge and creature art
        run: |
          npm run build:wiki
          npm run cardforge:render-art
      - name: Reject stale generated artifacts
        run: git diff --exit-code -- public/knowledge public/cardforge/full-art-canonical

  full-suite:
    name: Full deterministic suite
    needs: edition-contract
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22.13.1
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BLOCKWILD_NODE_VERSION }}
      - name: Restore TypeScript npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: blockwild-typescript-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            blockwild-typescript-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build and test
        run: npm test

  vercel-build:
    name: Vercel production build
    needs: edition-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Use Node.js 22.13.1
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BLOCKWILD_NODE_VERSION }}
      - name: Restore TypeScript npm cache
        uses: actions/cache@v6
        with:
          path: ~/.npm
          key: blockwild-typescript-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            blockwild-typescript-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Build production application
        run: npm run build:vercel
