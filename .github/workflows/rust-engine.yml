name: Rust edition engine

on:
  push:
    branches: [edition/rust]
    paths:
      - "engine/**"
      - "app/game/rust-*.ts"
      - "app/game/renderer-*.ts"
      - "app/game/engine-facade.ts"
      - "app/game/VoxelGame.tsx"
      - "app/game/engine.ts"
      - "app/game/world.ts"
      - "app/game/world-storage.ts"
      - "scripts/*rust*.mjs"
      - "scripts/*rust*.ts"
      - "scripts/generate-integrated-runtime-domain-schema.mjs"
      - "scripts/verify-integrated-runtime-schema-convergence.mjs"
      - "tests/rust-*.test.*"
      - "tests/renderer-*.test.*"
      - "tests/helpers/**"
      - "tests/fixtures/**"
      - "tests/acceptance/**"
      - "build/worldgen-build-profile.ts"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - "public/engine/**"
      - "public/renderer/**"
      - "docs/HYBRID_RUST_ENGINE_MIGRATION_MASTER_PLAN.md"
      - "docs/RUST_ENGINE_AUTHORITY_LEDGER.md"
      - ".github/workflows/rust-engine.yml"
  pull_request:
    branches: [edition/rust]
    paths:
      - "engine/**"
      - "app/game/rust-*.ts"
      - "app/game/renderer-*.ts"
      - "app/game/engine-facade.ts"
      - "app/game/VoxelGame.tsx"
      - "app/game/engine.ts"
      - "app/game/world.ts"
      - "app/game/world-storage.ts"
      - "scripts/*rust*.mjs"
      - "scripts/*rust*.ts"
      - "scripts/generate-integrated-runtime-domain-schema.mjs"
      - "scripts/verify-integrated-runtime-schema-convergence.mjs"
      - "tests/rust-*.test.*"
      - "tests/renderer-*.test.*"
      - "tests/helpers/**"
      - "tests/fixtures/**"
      - "tests/acceptance/**"
      - "build/worldgen-build-profile.ts"
      - "package.json"
      - "package-lock.json"
      - ".gitattributes"
      - "public/engine/**"
      - "public/renderer/**"
      - "docs/HYBRID_RUST_ENGINE_MIGRATION_MASTER_PLAN.md"
      - "docs/RUST_ENGINE_AUTHORITY_LEDGER.md"
      - ".github/workflows/rust-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blockwild-rust-engine-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: true
  CARGO_TERM_COLOR: always
  BLOCKWILD_EDITION: rust
  BLOCKWILD_NODE_VERSION: 22.13.1
  BLOCKWILD_RUST_TOOLCHAIN: 1.91.1

jobs:
  native-wasm-and-browser-contract:
    name: Native, Wasm, and browser contract
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: |
          rustup set profile minimal
          rustup toolchain install 1.91.1 --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.91.1
      - name: Cache Cargo downloads and targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: blockwild-rust-cargo-${{ runner.os }}-rustc-${{ env.BLOCKWILD_RUST_TOOLCHAIN }}-wasm32-release-compatibility-${{ hashFiles('engine/Cargo.lock', 'engine/Cargo.toml', 'engine/rust-toolchain.toml', 'engine/**/*.rs') }}
      - name: Format
        working-directory: engine
        run: cargo fmt --all --check
      - name: Native checks and tests
        working-directory: engine
        run: |
          cargo check --workspace --all-targets --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
      - name: Deterministic replay and renderer fixtures
        working-directory: engine
        run: |
          cargo run --locked -p blockwild-tools -- replay-self-test
          cargo run --locked -p blockwild-tools -- render-fixture
          cargo run --locked -p blockwild-tools -- render-smoke
      - name: Compile compatibility Wasm
        working-directory: engine
        run: cargo build --locked --release --target wasm32-unknown-unknown -p blockwild-wasm
      - name: Use Node.js 22.13.1
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BLOCKWILD_NODE_VERSION }}
      - name: Restore Rust-edition npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: blockwild-rust-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify TypeScript protocol and tooling
        run: npm run test:rust-engine
      - name: Publish current migration gate report
        run: node scripts/audit-rust-migration.mjs --out work/hybrid-rust-migration/ci-audit.json
      - name: Upload migration gate report
        uses: actions/upload-artifact@v7
        with:
          name: blockwild-rust-migration-gates-rustc-${{ env.BLOCKWILD_RUST_TOOLCHAIN }}-${{ github.sha }}
          path: work/hybrid-rust-migration/ci-audit.json
          if-no-files-found: error
      - name: Install matching wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.122 --locked
      - name: Rebuild immutable browser artifact
        run: |
          npm run build:rust-engine
          npm run build:rust-renderer-lab
      - name: Reject stale generated artifact
        run: |
          npm run check:rust-engine
          git diff --exit-code -- public/engine

  windows-native-contract:
    name: Windows native and browser contract
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        shell: pwsh
        run: |
          rustup set profile minimal
          rustup toolchain install 1.91.1 --component rustfmt,clippy --target wasm32-unknown-unknown
          rustup default 1.91.1
      - name: Cache Cargo downloads and targets
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/target
          key: blockwild-rust-cargo-${{ runner.os }}-rustc-${{ env.BLOCKWILD_RUST_TOOLCHAIN }}-wasm32-release-compatibility-${{ hashFiles('engine/Cargo.lock', 'engine/Cargo.toml', 'engine/rust-toolchain.toml', 'engine/**/*.rs') }}
      - name: Native and Wasm checks
        working-directory: engine
        run: |
          cargo check --workspace --all-targets --locked
          cargo test --workspace --locked
          cargo build --locked --release --target wasm32-unknown-unknown -p blockwild-wasm
      - name: Use Node.js 22.13.1
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.BLOCKWILD_NODE_VERSION }}
      - name: Restore Rust-edition npm cache
        uses: actions/cache@v5
        with:
          path: ~/.npm
          key: blockwild-rust-npm-${{ runner.os }}-node-${{ env.BLOCKWILD_NODE_VERSION }}-${{ hashFiles('package-lock.json') }}
      - name: Install browser dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify Windows protocol and renderer contracts
        run: npm.cmd run test:rust-engine
