version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: edition/rust
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: deps
  - package-ecosystem: github-actions
    directory: /
    target-branch: edition/rust
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci
  - package-ecosystem: cargo
    directory: /engine
    target-branch: edition/rust
    schedule:
      interval: weekly
      day: monday
      time: "10:00"
      timezone: America/Chicago
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: rust-deps
