[workspace]
members = [
  "crates/blockwild-types",
  "crates/blockwild-protocol",
  "crates/blockwild-world",
  "crates/blockwild-generation",
  "crates/blockwild-authority",
  "crates/blockwild-simulation",
  "crates/blockwild-entity",
  "crates/blockwild-persistence",
  "crates/blockwild-gameplay",
  "crates/blockwild-network",
  "crates/blockwild-engine",
  "crates/blockwild-render",
  "crates/blockwild-render-web",
  "crates/blockwild-runtime-wire",
  "crates/blockwild-wasm",
  "crates/blockwild-tools",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.91.1"
license = "MIT"
repository = "https://github.com/RedLynx101/blockwild"

[workspace.dependencies]
blockwild-types = { path = "crates/blockwild-types" }
blockwild-protocol = { path = "crates/blockwild-protocol" }
blockwild-world = { path = "crates/blockwild-world" }
blockwild-generation = { path = "crates/blockwild-generation" }
blockwild-authority = { path = "crates/blockwild-authority" }
blockwild-simulation = { path = "crates/blockwild-simulation" }
blockwild-entity = { path = "crates/blockwild-entity" }
blockwild-persistence = { path = "crates/blockwild-persistence" }
blockwild-gameplay = { path = "crates/blockwild-gameplay" }
blockwild-network = { path = "crates/blockwild-network" }
blockwild-engine = { path = "crates/blockwild-engine" }
blockwild-render = { path = "crates/blockwild-render" }
blockwild-render-web = { path = "crates/blockwild-render-web" }
blockwild-runtime-wire = { path = "crates/blockwild-runtime-wire" }
wasm-bindgen = "=0.2.127"
wasm-bindgen-futures = "=0.4.77"
wgpu = { version = "=30.0.1", default-features = false, features = ["std", "wgsl"] }
pollster = "=0.4.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.bench]
debug = 1
